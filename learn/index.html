<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robotics Path - Learning Platform</title>
<meta name="description" content="A 6-month, 120-module robotics engineering learning platform with progress tracking, notes and file uploads.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d9488'/%3E%3Cpath d='M16 6v4M10 12h12a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3H10a3 3 0 0 1-3-3v-6a3 3 0 0 1 3-3z' fill='none' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='12.5' cy='18' r='1.8' fill='white'/%3E%3Ccircle cx='19.5' cy='18' r='1.8' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script>
  // Apply theme before paint to avoid a flash
  try {
    var s = JSON.parse(localStorage.getItem('robotics-path-v1') || '{}');
    var t = s.settings && s.settings.theme;
    if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <a class="logo" href="#/">
      <span class="logo-mark"><svg viewBox="0 0 32 32" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 5v5M10 12h12a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3H10a3 3 0 0 1-3-3v-6a3 3 0 0 1 3-3z"/><circle cx="12.5" cy="18" r="1.4" fill="currentColor"/><circle cx="19.5" cy="18" r="1.4" fill="currentColor"/></svg></span>
      <span class="logo-text">Robotics Path<small>6 months · 120 modules</small></span>
    </a>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="mini-progress" id="sideProgress"></div>
      <a class="side-link" href="../">&larr; Back to portfolio</a>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" data-act="menu" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <button class="search-btn" data-act="search">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>Search modules, notes, resources…</span><kbd>Ctrl K</kbd>
      </button>
      <div class="top-right">
        <div class="timer-chip" id="timerChip" hidden></div>
        <button class="icon-btn" data-act="theme" aria-label="Toggle theme" title="Toggle theme" id="themeBtn"></button>
      </div>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
</div>

<div id="overlay" class="overlay" hidden></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="curriculum.js"></script>
<script src="app.js"></script>
<noscript><p style="padding:2rem">This learning platform needs JavaScript.</p></noscript>
</body>
</html>
